# render.yaml — Render.com Blueprint (updated for Docker-based Spring Boot)
# See: https://render.com/docs/blueprint-spec
#
# Two services:
#   smarthospital-backend  — Spring Boot 3.5 / Java 17  (Docker build)
#   smarthospital-ai       — Python Flask + scikit-learn (native Python runtime)
#
# All secrets are set in the Render dashboard — NEVER commit real values here.

services:

  # ─── Spring Boot Backend ──────────────────────────────────────────────────
  # Uses Docker so we control the exact JDK version and JVM heap flag.
  # Build context is the repository root (Render's default).
  - type: web
    name: smarthospital-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile    # Path from repository root
    dockerContext: .                      # Build context is repository root
    envVars:
      - key: DB_URL
        sync: false          # jdbc:mysql://<host>:3306/hospital_db — set in dashboard
      - key: DB_USERNAME
        sync: false          # your MySQL username — set in dashboard
      - key: DB_PASSWORD
        sync: false          # your MySQL password — set in dashboard, NEVER commit
      - key: ALLOWED_ORIGIN
        sync: false          # your Vercel frontend URL, e.g. https://xxx.vercel.app
    healthCheckPath: /health              # served by HealthController.java → HTTP 200

  # ─── Python Flask AI Service ──────────────────────────────────────────────
  # Uses Render's native Python runtime (no Docker needed for Flask).
  # app.py loads the model via: BASE_DIR/../ml-model/disease_model.pkl
  # Both ai-service/ and ml-model/ are at repo root — path resolves correctly.
  - type: web
    name: smarthospital-ai
    runtime: python
    buildCommand: pip install -r ai-service/requirements.txt
    startCommand: gunicorn --chdir ai-service app:app --bind 0.0.0.0:$PORT
    envVars: []
