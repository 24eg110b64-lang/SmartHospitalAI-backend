spring.application.name=SmartHospitalAI

# Server port — Render/Railway injects PORT at runtime; fall back to 8081 locally
server.port=${PORT:8081}

# ---- Database ---------------------------------------------------------------
# Production: set DB_URL, DB_USERNAME, DB_PASSWORD as environment variables.
# Local dev:  defaults point to the local MySQL instance.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate --------------------------------------------------------
# 'update' lets Hibernate create/alter tables automatically — safe for this project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- CORS -------------------------------------------------------------------
# Deployed frontend origin — set ALLOWED_ORIGIN in production env vars.
# Local dev default '*' keeps the existing behaviour unchanged.
app.cors.allowed-origin=${ALLOWED_ORIGIN:*}